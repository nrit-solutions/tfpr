# PR caller for tfpr. Copy to a consumer repo as
# .github/workflows/tfpr-pr.yml, next to tfpr.yml (the ops caller),
# tfpr-unlock.yml (the closed-event unlock) and drift.yml. One version
# pin: the dispatch action knows its own ref. tfpr-review.yml refreshes
# the approval row when a review lands.
#
# The lint steps are consumer-owned convention, not engine contract: they
# run the hooks from this repository's own .pre-commit-config.yaml, and you
# may extend, weaken, or remove them per repo. The engine-enforced gates
# (authorization, approval, merge gate) do not depend on them. Keep the
# dispatch as the last step of the same job: a job of its own waits for a
# second runner on every push (#506).
name: tfpr

# The closed event lives in tfpr-unlock.yml: splitting it out keeps a
# merged PR's checks list free of a second pre-commit row from the unlock
# run (#206).
on:
  pull_request:
    types: [opened, synchronize, reopened]

# No secrets and no check writes here: this file runs from the PR branch,
# which any writer can edit, so the ops run on the default branch does both.
permissions:
  contents: read
  actions: write         # dispatch the ops workflow

jobs:
  # The hooks gate the dispatch step: a failed lint stops it, so no plan
  # runs and no report lands on a PR that fails its own hooks; merge stays
  # blocked because the required merge gate is never created.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Full history: the hooks run on the diff to the PR base, and the
      # merge base must be present for that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Without the cache every push rebuilds every hook environment from
      # scratch, on the critical path in front of the dispatch. Keyed on the
      # config, so a hook bump invalidates cleanly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Only the files this PR changes: main is already clean, every merge
      # passed this same gate, so only changed files can fail. Hooks with
      # pass_filenames false still see the whole tree.
      - run: pipx run pre-commit run --from-ref "$BASE_SHA" --to-ref HEAD --show-diff-on-failure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # A template repository holds no infrastructure and no engine credentials,
      # so it lints its own pull requests and never dispatches.
      - if: github.event.repository.is_template != true
        uses: nrit-solutions/tfpr/.github/actions/dispatch@v12.9.3 # x-release-please-version
